name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (new push to a PR/branch) to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  MMO_TEST_DB_NAME: mmo_ci_${{ github.run_id }}_${{ github.run_attempt }}
  ELIXIR_ERL_OPTIONS: "+fnu"

permissions:
  contents: read

jobs:
  changes:
    name: Select affected contracts
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check scope selection contracts
        run: python3 .github/test_test_scope.py
      - id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/test-scope.py

  compile:
    name: Compile maintained apps
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'compile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-otp27-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile shared dependencies
        run: mix deps.compile

      - name: Compile maintained apps (warnings as errors)
        run: |
          # Strict compilation (warnings as errors).
          # scene_server compiled in its dedicated Rust-backed test job.
          strict_apps=(
            apps/mmo_contracts
            apps/gate_server
            apps/world_server
            apps/auth_server
            apps/data_service
          )

          for app in "${strict_apps[@]}"; do
            echo "::group::Compiling ${app#apps/}"
            (cd "$app" && mix compile --warnings-as-errors --no-optional-deps)
            echo "::endgroup::"
          done

  format:
    name: Format
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'format')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  test-gate-server:
    name: Test gate_server
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-gate-server')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache deps and cargo registry
        # _build is NOT cached: gate_server tests boot scene_server at runtime,
        # which loads the Rustler NIF (voxim_movement_nif). A warm _build cache
        # can omit the freshly-copied *.so
        # (documented in test-scene-server) → {:undef} NIF crashes. Rebuild the NIF
        # from source each run; the cargo registry cache keeps that fast.
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-otp27-mix-rust-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Setup database
        run: mix ecto.create -r DataService.Repo && mix ecto.migrate -r DataService.Repo

      - name: Run gate_server tests
        run: cd apps/gate_server && mix test --no-start
        # includes Voxim QUIC session/dispatch tests that boot auth/data deps against PostgreSQL

  test-data-service:
    name: Test data_service
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-data-service')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Setup database
        run: mix ecto.create -r DataService.Repo && mix ecto.migrate -r DataService.Repo

      - name: Run data_service tests
        run: cd apps/data_service && mix test --no-start

  test-scene-server:
    name: Test scene_server (Rust NIFs)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-scene-server')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache deps and cargo registry
        # _build is intentionally NOT cached. Rustler copies *.so into
        # _build/<env>/lib/scene_server/priv/native/, but the copy is not
        # always reproduced from a warm cache; previous runs have hit
        # {:load_failed, ...} when stale _build is restored without the
        # .so files. Always rebuild the NIF from scratch; cargo registry
        # cache keeps this under ~30s.
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-otp27-mix-rust-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (including Rust NIFs)
        run: mix compile

      - name: Run scene_server tests
        # Voxim M1 Scene: shared movement NIF, replication, body and prefab designer.
        run: cd apps/scene_server && mix test --no-start

  test-native-rust:
    name: Test native Rust crates
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-native-rust')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + native crate targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/voxel_region/native/voxim_worldgen

      - name: Run native crate unit tests
        run: (cd apps/voxel_region/native/voxim_worldgen && cargo test)

  test-standalone:
    name: Test standalone apps
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-standalone')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --no-optional-deps

      # agent_server / agent_manager were consolidated away during arch-align;
      # world_server is the remaining standalone (non-DB, non-Phoenix) app.
      - name: Run world_server tests
        run: cd apps/world_server && elixir --sname world_ci -S mix test --no-start

  test-auth-server:
    name: Test auth_server
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-auth-server')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache deps and cargo registry
        # _build is NOT cached: auth_server tests boot scene_server, whose Rustler
        # NIF (voxim_movement_nif) must load. A warm _build cache can omit the
        # freshly-copied *.so (documented in
        # test-scene-server) → NIF load_failed. Rebuild the NIF from source each run.
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-otp27-mix-rust-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Setup database
        run: mix ecto.create -r DataService.Repo && mix ecto.migrate -r DataService.Repo

      - name: Run auth_server tests
        # Phoenix 1.8 Endpoint uses persistent_term — needs the app started.
        run: cd apps/auth_server && mix test

  test-voxel-region:
    name: Test voxel_region (normal Mix entry)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-voxel-region')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Prepare isolated test fixtures
        run: python3 .github/prepare-test-fixtures.py

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache deps and cargo registry
        # _build is intentionally NOT cached. Rustler copies *.so into
        # _build/<env>/lib/scene_server/priv/native/, but the copy is not
        # always reproduced from a warm cache; previous runs have hit
        # {:load_failed, ...} when stale _build is restored without the
        # .so files. Always rebuild the NIF from scratch; cargo registry
        # cache keeps this under ~30s.
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-otp27-mix-rust-${{ hashFiles('**/mix.lock', '**/Cargo.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (including Rust NIFs)
        run: cd apps/voxel_region && mix compile

      - name: Run voxel_region tests
        run: cd apps/voxel_region && mix test --no-start

  test-mmo-contracts:
    name: Test mmo_contracts
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'test-mmo-contracts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout shared Voxim source and fixtures
        uses: ./.github/actions/voxim-fixtures
        with:
          ssh-key: ${{ secrets.VOXIM_READONLY_DEPLOY_KEY }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2.4"
          elixir-version: "1.18.5"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-mix-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: cd apps/mmo_contracts && mix compile

      - name: Run mmo_contracts tests
        run: cd apps/mmo_contracts && mix test --no-start

  required:
    name: CI result
    if: always()
    needs: [changes, compile, format, test-gate-server, test-data-service, test-scene-server, test-native-rust, test-standalone, test-auth-server, test-voxel-region, test-mmo-contracts]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', results
          selected = json.loads(results['changes']['outputs']['jobs'])
          assert all(results[j]['result'] == 'success' for j in selected), results
          PY
