# Voxim server — deployment stack (Postgres + one release container).
#
#   cd <deploy dir>            # contains this file, .env and the data dir
#   cp .env.example .env       # fill secrets, version and paths
#   docker compose up -d
#
# The app uses host networking: QUIC (UDP) must be answered from the host's own
# stack (a TUN/policy-routing proxy on the host drops bridged container UDP replies),
# and Scene peer nodes connect back over Erlang distribution on 127.0.0.1.
# HTTP (auth / regions / prefabs) listens on 127.0.0.1:${AUTH_PORT}; host nginx
# terminates TLS and proxies /playtest/ to it (deploy/nginx.conf.example).
name: voxim

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MMO_DB_USER}
      POSTGRES_PASSWORD: ${MMO_DB_PASSWORD}
      POSTGRES_DB: ${MMO_DB_NAME}
    ports:
      - "127.0.0.1:${MMO_DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MMO_DB_USER} -d ${MMO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: voxim-server:${VOXIM_VERSION}
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      MMO_DB_HOST: 127.0.0.1
    # World baselines, overlay-adjacent files (published prefabs) and certificates live here.
    volumes:
      - ${VOXIM_DATA_DIR}:/srv/voxim
    mem_limit: ${VOXIM_MEM_LIMIT}
    stop_grace_period: 60s

volumes:
  pg_data:
