[package]
name = "voxim_worldgen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = "=0.37.3"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"

[profile.test]
opt-level = 2
